# ОДНОРАЗОВЫЙ — диагностика роли Админ / admin на проде
name: oneoff — admin rbac diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}
      - run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -s' <<'EOS'
          set -euo pipefail
          cd /opt/crm
          docker compose --env-file .env -f infra/docker-compose.yml exec -T postgres \
            psql -U "$(grep -E '^POSTGRES_USER=' .env | cut -d= -f2-)" \
                 -d "$(grep -E '^POSTGRES_DB=' .env | cut -d= -f2-)" \
                 -v ON_ERROR_STOP=1 <<'SQL'
          \pset pager off
          SELECT id, name,
            permissions ? 'documents' AS has_documents,
            permissions->'documents' AS documents_actions,
            permissions ? 'broadcast' AS has_broadcast,
            permissions->'broadcast' AS broadcast_actions,
            (
              SELECT bool_and(
                (permissions->page) ?| array(SELECT jsonb_array_elements_text(acts))
              )
              FROM (
                VALUES
                  ('dashboard', '["view"]'::jsonb),
                  ('documents', '["view","create","edit","delete","share"]'::jsonb),
                  ('broadcast', '["view","send"]'::jsonb)
              ) AS t(page, acts)
            ) AS sample_cover_ok
          FROM roles
          WHERE name ILIKE '%admin%' OR name ILIKE '%админ%'
          ORDER BY name;
          SELECT u.id, u.username, u.is_active, r.name AS role_name,
            r.permissions->'documents' AS documents_actions,
            r.permissions ? 'broadcast' AS has_broadcast
          FROM users u
          JOIN roles r ON r.id = u.role_id
          WHERE r.name ILIKE '%admin%' OR r.name ILIKE '%админ%'
          ORDER BY u.username
          LIMIT 20;
          SQL
          EOS
