# One-off (диагностика, READ-ONLY): почему бот отвечает «доступ ограничен».
# Печатает состояние пользователя в CRM: users / user_roles / knowledge_bot_links
# + логи backend по внешнему контуру. Ничего не изменяет. Удалить после разбора.
name: oneoff — bot access diag

on:
  workflow_dispatch:
    inputs:
      identity:
        description: telegram-ник без @ (например chekhovandrey)
        required: true
        type: string
      telegram_user_id:
        description: chat_id в Telegram (например 95900854); 0 — пропустить
        required: false
        default: "0"
        type: string

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Query CRM database (read-only)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          IDENTITY: ${{ github.event.inputs.identity }}
          TG_ID: ${{ github.event.inputs.telegram_user_id }}
        run: |
          set -euo pipefail
          IDENT=$(printf '%s' "$IDENTITY" | tr '[:upper:]' '[:lower:]' | sed 's/^@//')
          case "$IDENT" in
            ''|*[^a-z0-9_.-]*) echo "bad identity: $IDENT"; exit 1 ;;
          esac
          case "$TG_ID" in
            ''|*[^0-9]*) TG="0" ;;
            *) TG="$TG_ID" ;;
          esac
          echo "IDENTITY_NORM=$IDENT TG_ID=$TG"
          ssh -o BatchMode=yes "${SSH_USER}@${SSH_HOST}" \
            "cd /opt/crm && docker compose --env-file .env -f infra/docker-compose.yml exec -T postgres \
              sh -lc 'psql -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\"'" <<SQL
          \echo '== 1. Пользователь =='
          SELECT id, username, telegram, last_name, first_name, is_active, is_system
          FROM users WHERE telegram = '${IDENT}' OR username = '${IDENT}';

          \echo '== 2. ВСЕ knowledge-линки этого пользователя (dead_at!) =='
          SELECT k.telegram_user_id, k.username, k.dead_at, k.started_at
          FROM knowledge_bot_links k
          JOIN users u ON u.id = k.user_id
          WHERE u.telegram = '${IDENT}'
          ORDER BY k.started_at;

          \echo '== 3. ВСЕ линки по chat_id (могут указывать на другого юзера) =='
          SELECT 'knowledge' AS src, k.telegram_user_id, k.username, k.dead_at,
                 u.username AS crm_user, u.telegram AS crm_telegram, u.is_active
          FROM knowledge_bot_links k LEFT JOIN users u ON u.id = k.user_id
          WHERE k.telegram_user_id = ${TG};

          \echo '== 4. Роль PM: права и признак sees_all_documents =='
          SELECT r.name, jsonb_object_keys(r.permissions) AS page
          FROM roles r
          JOIN user_roles ur ON ur.role_id = r.id
          JOIN users u ON u.id = ur.user_id
          WHERE u.telegram = '${IDENT}';

          \echo '== 5. Документы, видимые роли пользователя =='
          SELECT r.name AS role_name, count(dnr.node_id) AS visible_nodes
          FROM roles r
          JOIN user_roles ur ON ur.role_id = r.id
          JOIN users u ON u.id = ur.user_id
          LEFT JOIN document_node_roles dnr ON dnr.role_id = r.id
          WHERE u.telegram = '${IDENT}'
          GROUP BY r.name;

          \echo '== 6. Дубли chat_id в knowledge_bot_links =='
          SELECT telegram_user_id, count(*) AS rows, count(*) FILTER (WHERE dead_at IS NULL) AS alive
          FROM knowledge_bot_links GROUP BY telegram_user_id HAVING count(*) > 1;

          \echo '== 7. Документы: всего / публичных / ограниченных ролями =='
          SELECT count(*) AS total_nodes,
                 count(*) FILTER (WHERE NOT EXISTS (SELECT 1 FROM document_node_roles d WHERE d.node_id = n.id)) AS public_nodes,
                 count(*) FILTER (WHERE EXISTS (SELECT 1 FROM document_node_roles d WHERE d.node_id = n.id)) AS restricted_nodes
          FROM document_nodes n;

          \echo '== 8. Раздача документов по ролям =='
          SELECT r.name AS role_name, count(dnr.node_id) AS nodes
          FROM roles r LEFT JOIN document_node_roles dnr ON dnr.role_id = r.id
          GROUP BY r.name ORDER BY nodes DESC;
          SQL

      - name: Containers on server and bot logs
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          echo '--- контейнеры ---'
          ssh -o BatchMode=yes "${SSH_USER}@${SSH_HOST}" "docker ps --format '{{.Names}} | {{.Status}} | {{.Image}}'"
          echo '--- логи контейнеров бота ---'
          ssh -o BatchMode=yes "${SSH_USER}@${SSH_HOST}" 'for c in $(docker ps --format "{{.Names}}" | grep -iE "bot|knowledge"); do echo "### $c"; docker logs --tail 50 "$c" 2>&1 | tail -50; done' || echo 'контейнеров бота на этом сервере нет'

      - name: Backend structured logs (external contour)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "${SSH_USER}@${SSH_HOST}" \
            "cd /opt/crm && docker compose --env-file .env -f infra/docker-compose.yml logs --since 72h --no-log-prefix backend 2>/dev/null | grep -iE 'knowledge_bot|user_not_linked|external' | grep -viE 'INFO: +[0-9]' | tail -40 || echo 'структурных событий не найдено'"
