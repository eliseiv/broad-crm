# One-off: sample paid user revenue + remove after
name: oneoff — backend-users $ + AI keys

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sample paid users revenue
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -s' <<'EOS'
          set -euo pipefail
          cd /opt/crm
          docker compose --env-file .env -f infra/docker-compose.yml exec -T backend \
            python - <<'PY'
          import json, os, urllib.request

          BASE = "http://127.0.0.1:8000/api"

          def req(path, data=None, token=None, timeout=120):
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              body = None if data is None else json.dumps(data).encode()
              r = urllib.request.Request(
                  BASE + path, data=body, headers=headers, method="POST" if data else "GET"
              )
              with urllib.request.urlopen(r, timeout=timeout) as resp:
                  return json.load(resp)

          login = req("/auth/login", {
              "username": os.environ["ADMIN_USER"],
              "password": os.environ["ADMIN_PASSWORD"],
          })
          token = login["access_token"]
          backends = {b["code"]: b for b in req("/backends", token=token)["items"]}
          for code in ("232", "5109", "5112", "5089"):
              b = backends.get(code)
              if not b or not b.get("has_admin_api_key"):
                  print(f"{code}: skip")
                  continue
              listing = req(
                  f"/backend-users?backend_id={b['id']}&is_paid=true&limit=5",
                  token=token,
              )
              print(f"\n=== {code} paid sample (stats={listing.get('stats')}) ===")
              for u in listing.get("items") or []:
                  uid = u["id"]
                  try:
                      detail = req(
                          f"/backend-users/{b['id']}/users/{uid}",
                          token=token,
                      )
                      rev = detail.get("revenue")
                      sub = detail.get("subscription")
                      print(
                          f"user={uid} is_paid={u.get('is_paid')} "
                          f"payments_count={u.get('payments_count')} "
                          f"revenue={rev} sub_price={None if not sub else sub.get('price')}"
                      )
                      pays = req(
                          f"/backend-users/{b['id']}/users/{uid}/payments?limit=20",
                          token=token,
                      )
                      items = pays.get("items") or pays.get("payments") or []
                      if isinstance(pays, dict):
                          print(f"  payments_payload_keys={list(pays.keys())}")
                      for p in (items[:5] if isinstance(items, list) else []):
                          print(f"  pay amount={p.get('amount')} currency={p.get('currency')} status={p.get('status')} at={p.get('occurred_at')}")
                  except Exception as e:
                      print(f"user={uid} FAIL {e}")
          print("\nSAMPLE_OK")
          PY
          EOS
