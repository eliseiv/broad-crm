# One-off debug payments_sum — delete after run
name: oneoff — backend-users $ + AI keys

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Dump raw stats for backend 232
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -s' <<'EOS'
          set -euo pipefail
          cd /opt/crm
          docker compose --env-file .env -f infra/docker-compose.yml exec -T backend \
            python - <<'PY'
          import json, os, urllib.request
          from app.core.config import get_settings
          from app.infra.crypto import decrypt
          from app.db.session import SessionLocal
          from app.models.backend import Backend
          from sqlalchemy import select
          import asyncio
          from app.infra.backend_admin_client import BackendAdminClient

          BASE = "http://127.0.0.1:8000/api"

          def http(path, data=None, token=None):
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              body = None if data is None else json.dumps(data).encode()
              r = urllib.request.Request(BASE + path, data=body, headers=headers, method="POST" if data else "GET")
              with urllib.request.urlopen(r, timeout=60) as resp:
                  return json.load(resp)

          login = http("/auth/login", {"username": os.environ["ADMIN_USER"], "password": os.environ["ADMIN_PASSWORD"]})
          token = login["access_token"]
          backends = http("/backends", token=token)["items"]
          target = next(b for b in backends if b.get("code") == "232")
          crm = http(f"/backend-users?backend_id={target['id']}&limit=1", token=token)
          print("CRM_STATS", json.dumps(crm.get("stats"), ensure_ascii=False))
          print("CRM_ERRORS", json.dumps(crm.get("errors"), ensure_ascii=False))

          async def raw():
              async with SessionLocal() as db:
                  row = (await db.execute(select(Backend).where(Backend.code == "232"))).scalar_one()
                  key = decrypt(row.admin_api_key_encrypted)
                  client = BackendAdminClient(base_url=row.domain.rstrip("/"), admin_api_key=key)
                  stats = await client.get_stats()
                  print("RAW_UPSTREAM_STATS", json.dumps(stats, ensure_ascii=False, default=str))

          asyncio.run(raw())
          print("DEBUG_OK")
          PY
          EOS
