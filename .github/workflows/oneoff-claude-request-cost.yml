# One-off: себестоимость Claude IOS/РФ за 7д. Удалить после прогона.
name: oneoff — Claude IOS/РФ request cost

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload and run cost report
        run: |
          set -euo pipefail
          scp .github/scripts/claude_request_cost_report.py \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/claude_request_cost_report.py"
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd /opt/crm && \
             for i in \$(seq 1 60); do \
               if docker compose --env-file .env -f infra/docker-compose.yml exec -T backend \
                 python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)\" \
                 >/dev/null 2>&1; then echo backend_healthy; break; fi; \
               echo waiting_backend_\$i; sleep 5; \
             done && \
             docker compose --env-file .env -f infra/docker-compose.yml cp \
               /tmp/claude_request_cost_report.py backend:/tmp/claude_request_cost_report.py && \
             docker compose --env-file .env -f infra/docker-compose.yml exec -T backend \
               python /tmp/claude_request_cost_report.py"
