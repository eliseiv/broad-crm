# One-off READ-ONLY: деталь 422 от агрегатора. Удалить после.
name: oneoff — mail IMAP diag2

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Aggregator error body + DB check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          scp /tmp/mail_imap_probe.py "${SSH_USER}@${SSH_HOST}:/tmp/mail_imap_probe.py" 2>/dev/null || true
          # script is committed next to workflow for scp from checkout
          scp .github/scripts/mail_imap_probe.py "${SSH_USER}@${SSH_HOST}:/tmp/mail_imap_probe.py"
          ssh -o BatchMode=yes "${SSH_USER}@${SSH_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/crm
          echo '=== A. mail_accounts for marten/icloud ==='
          docker compose --env-file .env -f infra/docker-compose.yml exec -T postgres \
            sh -lc 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "
          SELECT id, email, number, app_name, is_active, last_sync_error, consecutive_failures, created_at
          FROM mail_accounts
          WHERE email ILIKE '\''%icloud%'\'' OR email ILIKE '\''%martenkaspar%'\''
          ORDER BY created_at DESC LIMIT 20;"'

          echo '=== B. proxy POST mailboxes last 2h ==='
          docker compose --env-file .env -f infra/docker-compose.yml logs --since 2h proxy 2>&1 \
            | grep -E 'POST /api/mail/mailboxes' | tail -n 40 || true

          echo '=== C+D. aggregator + direct IMAP probe ==='
          docker compose --env-file .env -f infra/docker-compose.yml cp /tmp/mail_imap_probe.py backend:/tmp/mail_imap_probe.py
          docker compose --env-file .env -f infra/docker-compose.yml exec -T backend python /tmp/mail_imap_probe.py
          echo DIAG2_DONE
          REMOTE
