name: SMS diag (one-off)

on:
  workflow_dispatch:
    inputs:
      phone:
        description: "Phone digits without +"
        required: true
        default: "12393595637"

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_DEPLOY_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Diagnose SMS fan-out for phone
        env:
          PHONE: ${{ inputs.phone }}
        run: |
          set -euo pipefail
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s -- "$PHONE" <<'REMOTE'
          set -euo pipefail
          PHONE="$1"
          E164="+${PHONE}"
          cd /opt/crm
          echo "=== host / compose ==="
          hostname
          docker compose --env-file .env -f infra/docker-compose.yml ps
          echo
          echo "=== SMS bot configured? (token presence only) ==="
          grep -E '^(SMS_TELEGRAM_BOT_TOKEN|SMS_BOT|TWILIO_|VERIFY_TWILIO)' .env | sed -E 's/(TOKEN|AUTH_TOKEN)=.*/\1=<set>/'
          echo
          echo "=== recent backend logs (sms_*) ==="
          docker compose --env-file .env -f infra/docker-compose.yml logs --tail=4000 backend 2>/dev/null \
            | grep -E "sms_|${PHONE}|${E164}" | tail -80 || true
          echo
          echo "=== SQL diagnostics ==="
          docker compose --env-file .env -f infra/docker-compose.yml exec -T postgres \
            psql -U crm -d crm -v ON_ERROR_STOP=1 <<SQL
          \pset pager off
          \echo '--- sms_phone_numbers ---'
          SELECT id, phone_number, team_id, is_active, login, app_name, note, created_at, updated_at
          FROM sms_phone_numbers
          WHERE phone_number = '${E164}' OR phone_number LIKE '%${PHONE}%';

          \echo '--- recent sms_inbound (to or from) ---'
          SELECT id, twilio_message_sid, from_number, to_number, team_id, received_at, left(body, 120) AS body
          FROM sms_inbound
          WHERE to_number = '${E164}' OR from_number = '${E164}'
             OR to_number LIKE '%${PHONE}%' OR from_number LIKE '%${PHONE}%'
          ORDER BY received_at DESC
          LIMIT 30;

          \echo '--- deliveries for those inbound ---'
          SELECT d.id, d.inbound_sms_id, d.user_id, d.telegram_user_id,
                 d.status, d.attempts, d.last_error, d.sent_at, d.updated_at,
                 i.to_number, i.from_number, i.received_at
          FROM sms_deliveries d
          JOIN sms_inbound i ON i.id = d.inbound_sms_id
          WHERE i.to_number = '${E164}' OR i.from_number = '${E164}'
             OR i.to_number LIKE '%${PHONE}%' OR i.from_number LIKE '%${PHONE}%'
          ORDER BY d.id DESC
          LIMIT 50;

          \echo '--- team members + telegram links (for number team if any) ---'
          WITH n AS (
            SELECT team_id FROM sms_phone_numbers WHERE phone_number = '${E164}' LIMIT 1
          )
          SELECT u.id AS user_id, u.username, u.telegram, u.is_active, u.is_system,
                 l.telegram_user_id, l.dead_at, l.created_at AS link_created_at,
                 ut.team_id AS membership_team
          FROM n
          JOIN user_teams ut ON ut.team_id = n.team_id
          JOIN users u ON u.id = ut.user_id
          LEFT JOIN sms_telegram_links l ON l.user_id = u.id
          ORDER BY u.username;

          \echo '--- channel extra teams (sms) for same team ---'
          WITH n AS (
            SELECT team_id FROM sms_phone_numbers WHERE phone_number = '${E164}' LIMIT 1
          )
          SELECT uct.user_id, u.username, uct.team_id, uct.channel,
                 l.telegram_user_id, l.dead_at
          FROM n
          JOIN user_channel_teams uct ON uct.team_id = n.team_id AND uct.channel = 'sms'
          JOIN users u ON u.id = uct.user_id
          LEFT JOIN sms_telegram_links l ON l.user_id = u.id;

          \echo '--- all live sms_telegram_links (count) ---'
          SELECT
            (SELECT count(*) FROM sms_telegram_links) AS links_total,
            (SELECT count(*) FROM sms_telegram_links WHERE dead_at IS NULL) AS links_live,
            (SELECT count(*) FROM sms_telegram_links WHERE dead_at IS NOT NULL) AS links_dead;
          SQL
          REMOTE
